name: Diagnostics

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Battery to execute
        required: true
        default: all
        type: choice
        options:
          - all
          - characters
          - encounters
          - shop
          - audit
          - types
          - browser

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        if: inputs.suite == 'all' || inputs.suite == 'types'
        run: npm run check

      - name: Character creation matrix and regression
        if: inputs.suite == 'all' || inputs.suite == 'characters'
        env:
          DIAGNOSTICS_OUTPUT: test-results/character-matrix.json
        run: |
          mkdir -p test-results
          node --test scripts/character-creation-regression.test.mjs

      - name: Persist matrix audit results
        if: always() && hashFiles('test-results/character-matrix.json') != ''
        continue-on-error: true
        env:
          SUPABASE_URL: https://akbvedwkpjokphzridla.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DIAGNOSTICS_OUTPUT: test-results/character-matrix.json
        run: node scripts/persist-diagnostics.mjs

      - name: Shop regression
        if: inputs.suite == 'all' || inputs.suite == 'shop'
        run: node --test scripts/shop-regression.test.mjs

      - name: Encounter regression
        if: inputs.suite == 'all' || inputs.suite == 'encounters'
        run: node --test scripts/encounter-regression.test.mjs

      - name: Manual and CSS audits
        if: inputs.suite == 'all' || inputs.suite == 'audit'
        run: |
          npm run audit:manual
          npm run audit:css

      - name: Install Chromium
        if: inputs.suite == 'all' || inputs.suite == 'browser'
        run: npx playwright install --with-deps chromium

      - name: Browser regression
        if: inputs.suite == 'all' || inputs.suite == 'browser'
        run: npx playwright test tests/e2e/character-creator.spec.ts tests/e2e/css-regression.spec.ts

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 30
