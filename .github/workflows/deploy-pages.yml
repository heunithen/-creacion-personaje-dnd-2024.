name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Convert NWN portraits to WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          folder = Path('public/images/character-creation/portraits')
          converted = 0
          for source in sorted(folder.glob('*.tga')):
              target = source.with_suffix('.webp')
              with Image.open(source) as image:
                  image = image.convert('RGBA')
                  image = ImageOps.fit(image, (512, 512), method=Image.Resampling.LANCZOS, centering=(0.5, 0.0))
                  image.save(target, 'WEBP', quality=88, method=6)
              source.unlink()
              converted += 1
          print(f'Converted {converted} NWN portraits to square 512x512 WebP (top-aligned crop).')
          PY
          if git status --short | grep -q 'public/images/character-creation/portraits/'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/images/character-creation/portraits/
            git commit -m 'Convert NWN portraits to WebP'
            git push
          fi
      - name: Convert and register square portraits in Supabase
        env:
          SUPABASE_URL: https://akbvedwkpjokphzridla.supabase.co
          SUPABASE_KEY: sb_publishable_BOiPUrLlhogEadY_phsFMw_s6JrIzcP
        run: python scripts/migrate-portraits-to-supabase.py
      - name: Split class pin sheet into individual emblems
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          source = Path('public/images/character-creation/classes/dungeons-dragons-limited-edition-class-pin-set-809158_900x_1d4036a4-3e79-4c87-83ce-4b621601ba1d_1024x.webp')
          output = Path('public/images/character-creation/classes/individual')
          output.mkdir(parents=True, exist_ok=True)
          # 4 columnas x 3 filas; cada recorte incluye el emblema completo y su marco.
          x_positions = [118, 318, 518, 718]
          y_positions = [48, 348, 668]
          with Image.open(source) as original:
              image = original.convert('RGBA')
              for row, top in enumerate(y_positions, start=1):
                  for col, left in enumerate(x_positions, start=1):
                      crop = image.crop((left, top, left + 180, top + 280))
                      crop.save(output / f'class-emblem-{(row-1)*4+col:02d}.webp',
                                'WEBP', quality=92, method=6)
          print('Created 12 individual class emblems.')
          PY
          if git status --short | grep -q 'public/images/character-creation/classes/individual/'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/images/character-creation/classes/individual/
            git commit -m 'Split class pin sheet into individual emblems'
            git push
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run check
      - name: Audit CSS cascade and external selectors
        run: npm run audit:css
      - name: Test character creation combinations
        run: npm run test:builder
      - name: Test encounter budget and generation rules
        run: npm run test:encounters
      - name: Audit manual and character progression
        run: npm run audit:manual
      - name: Build
        run: npm run build
      - name: Install Chromium for browser tests
        run: |
          # Evita que un repositorio Microsoft externo bloqueado impida instalar dependencias de Playwright.
          for source in $(sudo grep -rl 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true); do sudo rm -f "$source"; done
          npx playwright install --with-deps chromium
      - name: Test character creator and CSS responsiveness in Chromium
        run: npx playwright test tests/e2e/character-creator.spec.ts tests/e2e/css-regression.spec.ts
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          if-no-files-found: ignore
      # La matriz exhaustiva de 1.920 combinaciones queda fuera del despliegue
      # hasta corregir sus selectores; se conserva para retomarla posteriormente.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
