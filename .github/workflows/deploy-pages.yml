name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Convert NWN portraits to WebP
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          folder = Path('public/images/character-creation/portraits')
          converted = 0
          for source in sorted(folder.glob('*.tga')):
              target = source.with_suffix('.webp')
              with Image.open(source) as image:
                  image = image.convert('RGBA')
                  image = ImageOps.fit(image, (256, 512), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
                  image.save(target, 'WEBP', quality=88, method=6)
              source.unlink()
              converted += 1
          print(f'Converted {converted} NWN portraits to 256x512 WebP.')
          PY
          if git status --short | grep -q 'public/images/character-creation/portraits/'; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public/images/character-creation/portraits/
            git commit -m 'Convert NWN portraits to WebP'
            git push
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npm run check
      - name: Audit manual and character progression
        run: npm run audit:manual
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4